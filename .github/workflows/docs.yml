name: Docs

on:
  pull_request:
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check local Markdown links
        run: |
          python - <<'PY'
          import pathlib, re, sys

          root = pathlib.Path(".")
          pattern = re.compile(r"\[[^\]]*\]\(([^)]+)\)")
          missing = []

          for md in root.rglob("*.md"):
              if ".git" in md.parts:
                  continue
              for target in pattern.findall(md.read_text(encoding="utf-8", errors="ignore")):
                  if target.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  path = (md.parent / target.split("#")[0]).resolve()
                  if not path.exists():
                      missing.append(f"{md}: {target}")

          if missing:
              print("\n".join(missing))
              sys.exit(1)
          print("all local links resolve")
          PY
