name: Release consistency

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test release failure scenarios
        run: python -X utf8 -B -m unittest ci.test_release_consistency test_product_version test_release_tools -v
      - name: Check source, payload plans and candidate documents
        run: python -X utf8 -B ci/check_release.py --require-clean
